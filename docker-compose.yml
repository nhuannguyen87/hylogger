# LEGACY: the old Django prototype's database (backend-django-old/). The
# website's FastAPI backend reads the ETL4 database instead (backend/.env).
#
#   docker compose up -d      start it
#   docker compose down       stop it
#   docker compose down -v    stop it AND delete all the data

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: hylogger-db
    environment:
      POSTGRES_DB: hylogger
      POSTGRES_USER: hylogger
      POSTGRES_PASSWORD: hylogger
    ports:
      - "5433:5432"
    volumes:
      - hylogger-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hylogger -d hylogger"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  hylogger-pgdata:
